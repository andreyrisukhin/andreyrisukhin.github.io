<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <p>&lt;!doctype html&gt;</p> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Terrarium</title> <link rel="stylesheet" href="/assets/css/main.css"> <div id="terrarium-root"> <canvas id="terrarium-canvas"></canvas> <div id="terrarium-ui"> <button id="btn-pause">Pause</button> <button id="btn-reset">Reset</button> <div class="terrarium-scenes" role="group" aria-label="Scenes"> <button data-scene="particles" class="is-active">Particles</button> <button data-scene="creatures">Creatures</button> <button data-scene="herbavores">Herbavores</button> </div> <span id="terrarium-alert" role="status" aria-live="polite"></span> <span id="fps"></span> </div> <div id="terrarium-panel" aria-label="Herbavores Controls"> <div class="panel-title"> Herbavores <button id="herb-toggle-panel" type="button" aria-expanded="true">Hide</button> </div> <div class="panel-controls"> <label> Hunger rate <input id="herb-hunger-rate" type="range" min="0.01" max="0.12" step="0.005"> <span class="panel-value" id="herb-hunger-rate-value"></span> </label> <label> Vision <input id="herb-vision" type="range" min="120" max="360" step="5"> <span class="panel-value" id="herb-vision-value"></span> </label> <label> Max speed <input id="herb-max-speed" type="range" min="60" max="200" step="5"> <span class="panel-value" id="herb-max-speed-value"></span> </label> <label> Sim speed <input id="herb-sim-speed" type="range" min="0" max="7" step="1"> <span class="panel-value" id="herb-sim-speed-value"></span> </label> <label> Food spawn <input id="herb-food-rate" type="range" min="0.01" max="0.2" step="0.005"> <span class="panel-value" id="herb-food-rate-value"></span> </label> <label> Repro cooldown <input id="herb-repro-cd" type="range" min="6" max="40" step="1"> <span class="panel-value" id="herb-repro-cd-value"></span> </label> <label> Lifespan <
