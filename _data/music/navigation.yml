- title: Harmony
  id: tools
  description: Explore harmony and build set lists in Workbench. Keep named copies in the Song library.
  aliases:
    - /music/build/
    - /music/chord-recognizer/
    - /music/stradella/
  items:
    - title: Workbench
      url: /music/workbench/
      description: Study chords, recognize notes, browse recipes, and build progressions or timed set lists.
    - title: Song library
      url: /music/songs/
      description: Open saved studies and Stradella songs, with backups and optional set-list sync.

- title: Practice
  id: practice
  description: Play the keyboard, work on a pattern, or follow a practice loop.
  items:
    - title: Exercises
      url: /music/exercises/
      description: Practice loops with right-hand patterns and theory notes.
    - title: Bass patterns
      url: /music/bass-patterns/
      description: Write a left-hand pattern, assign fingers, and keep a pattern code.
    - title: 12-bar blues
      url: /music/blues/
      description: Pick a key, see the progression and blues scale.
    - title: Bayan simulator
      url: /music/bayan-simulator/
      description: Play a B-system button keyboard with Minecraft note-block sounds.

- title: Sheets
  id: sheets
  items:
    - title: Open MusicXML
      url: /music/sheet/open/
      description: Read a file on your device without uploading or publishing it.
    - title: Into the Unknown
      url: /music/sheet/into-the-unknown/
      description: Piano transcription from Over the Garden Wall.
    - title: Into the Unknown (bayan)
      url: /music/sheet/into-the-unknown-bayan/
      description: Bayan arrangement of the same piece, both hands rewritten.
    - title: Cogwork Dancers
      url: /music/sheet/cogwork-dancers/
      description: Christopher Larkin’s music, arranged for organ.
    - title: Reclaiming Entropy
      url: /music/sheet/reclaiming-entropy/
      description: James Primate’s music from Rain World.
    - title: Reconstructing More Science
      url: /music/sheet/reconstructing-more-science/
      description: From the Portal 2 soundtrack. Eight-bar two-hand exercise in F minor.
    - title: Señorita
      url: /music/sheet/senorita/
      description: Accordion arrangement, first draft. Sixteen bars in A minor.

- title: References
