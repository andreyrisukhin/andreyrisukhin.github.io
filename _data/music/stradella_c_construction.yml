        intervals: "1–3–b5check-m7"
        semitone: "0–4–2–4"
        recipe: "G♭7 / C"
        notes: "G♭ is 5th flat of C. Maj3,Dim3,Maj3 stack intervals. A 7b5 chord is equivalent to a chord of the same kind built 3 steps up or 3 steps down. For example, C7b5 is equivalent to F#7b5 (F# is three steps above C) just as it is equivalent to Gb7b5 (Gb is three steps below C)"
