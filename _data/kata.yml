recipes:
  - id: morning-clear-form
    title: Morning Form
    summary: Start the day, building up movement and breath.
    image: /assets/img/kata/rearview-flaming-sky.jpg
    image_alt: Rearview mirror with a flaming sunrise sky
    details:
      - label: "Opening stillness (1 min)"
        detail: "stand tall, knees soft, hands on lower ribs, eyes half-closed. Breathe 4-2-6 for 5 cycles. Cue: Arriving."
      - label: Neck + spine wave (1.5 min)
        detail: "slow neck half-circles x 3 each way, shoulder rolls back x 6, chin to chest -> roll down -> roll up. Breathe in to lift, out to fold."
      - label: Grounded hip + leg flow (1.5 min)
        detail: "wide stance, shift side to side, gentle squat x 5, forward fold -> half-lift -> fold x 3. Exhale on effort, inhale on rise. Cue: Heavy feet, light head."
      - label: Sun-style flow (2 min)
        detail: "3 slow rounds (arms up inhale, fold exhale, half lift inhale, step back to plank, gentle cobra inhale, downward dog exhale 2 breaths, step forward to rise)."
      - label: Standing balance + breath (1 min)
        detail: "one leg, hands on belly, 3 slow breaths each side. Optional eyes closed."
      - label: Closing breath (1 min)
        detail: "stand still, inhale 4, exhale 8, 5 rounds. Cue: Ready."
    tip: awareness onto steady breath, we'll think about tasks soon.
  - id: night-soften
    title: Sleep Form
    summary: A 8-10 minute closing kata to downshift the nervous system before sleep.
    image: /assets/img/kata/end-of-the-day.jpg
    image_alt: Empty rooftop parking lot at night
    details:
      - label: Hard stop (30 sec)
        detail: "close laptop, turn screen face down, stand, say: Done for today."
      - label: Standing unload (2 min)
        detail: "feet hip-width, arms heavy, low gaze. Breathe 4 in / 8 out for 6 cycles. Add neck drops, shoulder shakes, jaw release. Cue: Let go."
      - label: Forward folding sequence (3 min)
        detail: "slow fold with bent knees, sway. Half-lift -> fold x 3. Hamstring stretch seated or standing. Hug knees to chest if on floor. Long quiet exhales."
      - label: Ground contact (2-3 min)
        detail: "sit or lie down, one hand chest, one belly. Inhale 3-4, exhale 7-10. Optional gentle twist or knees side to side. Cue: Nothing to solve."
      - label: Closing signal (1 min)
        detail: "lie flat or sit upright, hands by sides, stillness. Say internally: Body resting. Mind resting. Tomorrow later."
    tip: feel each mouth exhale drop the shoulders.
